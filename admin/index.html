<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeaScribe 管理后台</title>
<!-- Anti-flash: set theme before render -->
<script>
(function(){
  var t = localStorage.getItem('seascribe_theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="../main/css/theme.css">
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/config.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="../main/css/custom-select.css">
</head>
<body>

<!-- ====== 登录页 ====== -->
<div id="admin-login">
  <div class="admin-login-topbar">
    <a class="admin-login-topbar-brand" href="/" title="回到主站"><img src="../main/logo.png" alt="SeaScribe" style="width:1.1em;height:1.1em">SeaScribe</a>
    <span class="admin-login-topbar-spacer"></span>
    <button id="btn-theme-login" class="admin-btn admin-btn-ghost admin-btn-sm" title="切换夜间模式">🌙</button>
  </div>
  <div class="admin-login-body">
  <div class="admin-login-card">
    <div class="admin-login-logo"><img src="../main/logo.png" alt="SeaScribe" style="width:64px;height:64px"></div>
    <h1>SeaScribe</h1>
    <p class="admin-login-sub">管理后台</p>
    <div class="admin-login-field">
      <label for="login-username">用户名</label>
      <input type="text" id="login-username" placeholder="英文用户名" autocomplete="username">
    </div>
    <div class="admin-login-field">
      <label for="login-password">密码</label>
      <div style="position:relative">
        <input type="password" id="login-password" placeholder="输入密码" autocomplete="current-password" style="width:100%;padding-right:60px">
        <button type="button" id="login-clear-pw" class="pw-action-btn" style="right:32px;display:none" title="清除"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        <button type="button" id="login-toggle-pw" class="pw-action-btn" style="right:6px" title="显示密码"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>
    <p id="login-error" class="admin-login-error hidden"></p>
    <button id="login-submit" class="admin-btn admin-btn-primary">登 录</button>
    <button id="login-to-register" class="admin-btn admin-btn-ghost admin-btn-sm" style="margin-top:-8px">注册新账号</button>
  </div>

  <!-- 注册表单 -->
  <div class="admin-login-card hidden" id="register-card">
    <div class="admin-login-logo">📝</div>
    <h1>注册账号</h1>
    <p class="admin-login-sub">注册后将自动进入绑定姓名流程</p>
    <div class="admin-login-field">
      <label for="register-username">用户名</label>
      <input type="text" id="register-username" placeholder="字母开头，3-20位字母或数字" autocomplete="username">
      <span class="reg-hint" id="reg-hint-username">字母开头，3-20位，可含数字和下划线</span>
    </div>
    <div class="admin-login-field">
      <label for="register-nickname">昵称</label>
      <input type="text" id="register-nickname" placeholder="给自己起个名字（可选）">
      <span class="reg-hint" id="reg-hint-nickname">给自己起个好记的名字，最长20字</span>
    </div>
    <div class="admin-login-field">
      <label for="register-password">密码</label>
      <input type="password" id="register-password" placeholder="至少6位" autocomplete="new-password">
      <span class="reg-hint" id="reg-hint-password">至少 6 位字符</span>
    </div>
    <div class="admin-login-field">
      <label for="register-password2">确认密码</label>
      <input type="password" id="register-password2" placeholder="再次输入密码" autocomplete="new-password">
      <span class="reg-hint" id="reg-hint-password2">与上方密码一致</span>
    </div>
    <p id="register-error" class="admin-login-error hidden"></p>
    <button id="register-submit" class="admin-btn admin-btn-primary" disabled>注 册</button>
    <button id="register-to-login" class="admin-btn admin-btn-ghost admin-btn-sm" style="margin-top:-8px">返回登录</button>
  </div>
  </div><!-- .admin-login-body -->
</div>

<!-- ====== 绑定姓名（首次登录，displayName 为空时显示） ====== -->
<div id="admin-bind" class="hidden">
  <div class="admin-login-topbar">
    <a class="admin-login-topbar-brand" href="/" title="回到主站"><img src="../main/logo.png" alt="SeaScribe" style="width:1.1em;height:1.1em">SeaScribe</a>
    <span class="admin-login-topbar-spacer"></span>
    <button id="btn-theme-bind" class="admin-btn admin-btn-ghost admin-btn-sm" title="切换夜间模式">🌙</button>
    <button id="btn-bind-logout" class="admin-btn admin-btn-ghost admin-btn-sm" title="退出登录">退出</button>
  </div>
  <div class="admin-login-body">
  <div class="admin-login-card">
    <div class="admin-login-logo">👤</div>
    <h1>绑定姓名</h1>
    <p class="admin-login-sub">从名单中选择班级和姓名，用于点名系统匹配</p>
    <div class="admin-login-field">
      <label for="bind-class">班级</label>
      <select id="bind-class">
        <option value="">— 选择班级 —</option>
      </select>
    </div>
    <div class="admin-login-field">
      <label for="bind-displayname">姓名</label>
      <select id="bind-displayname">
        <option value="">— 先选择班级 —</option>
      </select>
    </div>
    <p id="bind-error" class="admin-login-error hidden"></p>
    <button id="bind-submit" class="admin-btn admin-btn-primary" disabled>确认绑定</button>
  </div>
  </div><!-- .admin-login-body -->
</div>

<div id="admin-toast-area"></div>

<!-- ====== 管理面板 ====== -->
<div id="admin-app" class="admin-app hidden">
  <header class="admin-topbar">
    <a class="admin-topbar-brand" href="/" title="回到主站"><img class="admin-topbar-logo" src="../main/logo.png" alt="">SeaScribe</a><span class="admin-topbar-version">管理后台</span>
    <nav id="admin-nav" class="admin-nav"></nav>
    <span class="admin-topbar-spacer"></span>
    <div class="admin-user-info" id="admin-user-info"></div>
    <button id="btn-theme" class="admin-btn admin-btn-ghost admin-btn-sm" title="切换夜间模式">🌙</button>
    <button id="admin-logout-btn" class="admin-btn admin-btn-ghost admin-btn-sm" title="退出登录"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> <span class="btn-label">退出</span></button>
  </header>
  <main class="admin-main">
    <div id="admin-content" class="admin-content"></div>
  </main>
</div>

<script src="js/common.js"></script>
<script src="../main/js/custom-select.js"></script>
<script src="js/router.js"></script>
<script src="js/pages/profile.js"></script>
<script src="js/pages/users.js"></script>
<script src="js/pages/roster.js"></script>
<script src="js/pages/records.js"></script>
<script src="js/pages/files.js"></script>
<script src="js/pages/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
