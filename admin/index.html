<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeaScribe 管理后台</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- ====== 登录页 ====== -->
<div id="admin-login" class="admin-login">
  <div class="admin-login-card">
    <div class="admin-login-logo">⚓</div>
    <h1>SeaScribe</h1>
    <p class="admin-login-sub">管理后台</p>
    <div class="admin-login-field">
      <label for="login-username">用户名</label>
      <input type="text" id="login-username" placeholder="英文用户名" autocomplete="username">
    </div>
    <div class="admin-login-field">
      <label for="login-password">密码</label>
      <input type="password" id="login-password" placeholder="输入密码" autocomplete="current-password">
    </div>
    <p id="login-error" class="admin-login-error hidden"></p>
    <button id="login-submit" class="admin-btn admin-btn-primary">登 录</button>
  </div>
</div>

<!-- ====== 管理面板 ====== -->
<div id="admin-app" class="admin-app hidden">
  <header class="admin-topbar">
    <span class="admin-topbar-brand">⚓ SeaScribe <small>管理后台</small></span>
    <nav id="admin-nav" class="admin-nav"></nav>
    <span class="admin-topbar-spacer"></span>
    <div class="admin-user-info" id="admin-user-info"></div>
    <button id="admin-logout-btn" class="admin-btn admin-btn-ghost admin-btn-sm">退出登录</button>
  </header>
  <main class="admin-main">
    <div id="admin-content" class="admin-content"></div>
  </main>
</div>

<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
<script src="js/users.js"></script>
<script src="js/config.js"></script>
<script src="js/files.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
