<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="renderer" content="webkit">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<title>SeaScribe — 课堂听写</title>
<link rel="icon" href="main/logo.png">

<!-- Config (must load first) -->
<script src="config/config.js?v=6.1.3"></script>

<!-- Theme init (must be inline to prevent flash) -->
<script>
(function(){
  var t = localStorage.getItem('seascribe_theme');
  if (!t) {
    t = (window.__SEASCRIBE_CONFIG__ && window.__SEASCRIBE_CONFIG__.theme) || 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>

<!-- Stylesheets -->
<link rel="stylesheet" href="main/css/theme.css?v=6.1.3">
<link rel="stylesheet" href="main/css/base.css?v=6.1.3">
<link rel="stylesheet" href="main/css/topbar.css?v=6.1.3">
<link rel="stylesheet" href="main/css/pages.css?v=6.1.3">
<link rel="stylesheet" href="main/css/controls.css?v=6.1.3">
<link rel="stylesheet" href="main/css/cards.css?v=6.1.3">
<link rel="stylesheet" href="main/css/splash.css?v=6.1.3">
<link rel="stylesheet" href="main/css/changelog.css?v=6.1.3">
<link rel="stylesheet" href="main/css/responsive.css?v=6.1.3">
<link rel="stylesheet" href="main/css/custom-select.css?v=6.1.3">
<link rel="stylesheet" href="main/css/picker.css?v=6.1.3">
</head>
<body>

<!-- ========== 点名：动画层 + 结果展示层 ========== -->
<div id="pick-decorative" class="pick-decorative hidden">
  <div class="pick-decorative-inner">
    <span id="pick-decorative-time" class="pick-decorative-time"></span>
    <img id="pick-decorative-avatar" class="pick-decorative-avatar hidden" src="" alt="">
    <span id="pick-decorative-text" class="pick-decorative-text"></span>
    <span id="pick-decorative-sig" class="pick-decorative-sig"></span>
  </div>
  <div id="pick-decorative-cards" class="pick-decorative-cards hidden"></div>
  <span class="pick-decorative-hint">点击屏幕继续</span>
</div>
<div id="pick-process" class="pick-process hidden"></div>

<!-- ========== 点名配置弹窗 ========== -->
<div id="picker-modal" class="picker-modal hidden">
  <div class="picker-modal-card">
    <button id="picker-close-x" class="modal-close-x" title="关闭">✕</button>
    <div class="picker-modal-title">🎲 随机点名</div>

    <div class="picker-section">
      <span class="picker-section-label">📋 班级名单</span>
      <select id="picker-list-select" class="picker-select"></select>
    </div>

    <div class="picker-section">
      <span class="picker-section-label">🎲 随机方式</span>
      <div id="picker-method-group" class="picker-radio-group">
        <!-- JS 动态渲染 -->
      </div>
    </div>

    <div class="picker-section">
      <span class="picker-section-label">👥 点几人</span>
      <div class="picker-count-row">
        <button id="picker-count-minus" class="btn btn-ghost btn-sm-picker" title="减少人数" type="button">−</button>
        <span id="picker-count-value" class="picker-count-value">1</span>
        <button id="picker-count-plus" class="btn btn-ghost btn-sm-picker" title="增加人数" type="button">+</button>
        <span class="picker-count-unit">人</span>
        <span id="picker-count-hint" class="picker-count-hint hidden">一次最多 10 人</span>
      </div>
    </div>

    <div class="picker-section picker-multi-section hidden" id="picker-multi-section">
      <span class="picker-section-label">🎬 多人动画</span>
      <div class="picker-multi-radio-row">
        <label class="picker-radio-item-slim"><input type="radio" name="picker-multi-mode" value="simultaneous" checked><span>同时定格</span></label>
        <label class="picker-radio-item-slim"><input type="radio" name="picker-multi-mode" value="sequential"><span>逐个定格</span></label>
      </div>
    </div>

    <div class="picker-section">
      <span class="picker-section-label">✨ 修饰动画</span>
      <select id="picker-decorative" class="picker-select">
        <!-- JS 动态渲染 -->
      </select>
    </div>

    <div class="picker-section picker-section-advanced">
      <label class="picker-checkbox">
        <input type="checkbox" id="picker-show-process">
        <span>显示真实随机过程</span>
      </label>
      <div id="picker-process-mode-group" class="picker-process-mode-row">
        <!-- JS 动态渲染 -->
      </div>
    </div>

    <div class="picker-section">
      <label class="picker-checkbox">
        <input type="checkbox" id="picker-timestamp" checked>
        <span>记录点名时间（避免重复）</span>
      </label>
      <div class="picker-ts-actions">
        <button id="picker-ts-view" class="btn btn-ghost btn-sm-picker" disabled>📋 查看记录</button>
      </div>
      <div id="picker-ts-panel" class="picker-ts-panel hidden">
        <div class="picker-ts-panel-header">
          <span class="picker-ts-panel-title">📋 点名记录</span>
          <button id="picker-ts-panel-close" class="modal-close-x" title="关闭" style="position:static;width:24px;height:24px;font-size:0.85rem">✕</button>
        </div>
        <div id="picker-ts-body" class="picker-ts-body"></div>
      </div>
      <label class="picker-checkbox" style="margin-top:8px">
        <input type="checkbox" id="picker-debug-toggle">
        <span>🔧 调试模式（跳过随机，指定姓名播动画）</span>
      </label>
    </div>

    <div class="picker-section picker-section-advanced picker-debug-collapsed" id="picker-debug-section">
      <span class="picker-section-label">🔧 调试动画</span>
      <select id="picker-debug-name" class="picker-select">
        <option value="">— 选择姓名后播放动画 —</option>
      </select>
      <button id="picker-debug-play" class="btn btn-dark btn-sm" disabled>🎬 播放动画</button>
    </div>

    <div class="picker-actions">
      <button id="picker-start" class="btn btn-dark" disabled>开始点名</button>
    </div>
  </div>
</div>

<!-- ========== 开屏动画 ========== -->
<div id="splash" class="splash">
  <div class="splash-content">
    <img class="splash-logo" src="main/logo.png" alt="">
    <span class="splash-title">SeaScribe</span>
    <span class="splash-author">谦虚の海鸥</span>
    <span class="splash-version">v5.0.0</span>
    <span class="splash-vibecoding">本项目使用 vibecoding 开发</span>
    <div id="splash-log" class="splash-log"></div>
    <span class="splash-hint">点击任意位置或按任意键继续</span>
  </div>
</div>

<!-- ========== 顶栏 ========== -->
<header class="topbar">
  <span class="topbar-brand" id="brand-logo" title="回到学科选择"><img class="topbar-logo" src="main/logo.png" alt="">SeaScribe</span><span class="topbar-version">v5.0.0</span>
  <span class="topbar-spacer"></span>
  <div class="topbar-picker" id="topbar-picker">
    <span id="pick-result" class="pick-result"></span>
    <button id="btn-picker" class="topbar-btn">🎲 <span class="btn-label">随机点名</span></button>
  </div>
  <span id="admin-status" class="admin-status hidden"></span>
  <a class="topbar-btn" id="btn-admin" href="/admin/" title="管理后台">🔧 <span class="btn-label">管理后台</span></a>
  <button class="tool-btn icon-btn" id="btn-theme" title="切换夜间模式">🌙</button>
  <div class="topbar-more">
    <button class="topbar-btn" id="btn-more">⋯ <span class="btn-label">更多</span></button>
    <div class="more-menu hidden" id="more-menu">
      <button class="more-item" id="btn-changelog">📜 更新日志</button>
      <button class="more-item" id="btn-syslog">📋 系统日志</button>
      <button class="more-item" id="btn-about"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48" fill="none" style="vertical-align:-3px;margin-right:2px"><circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="3"/><path d="M24 14 L24 30" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><circle cx="24" cy="37" r="2.5" fill="currentColor"/></svg> 关于</button>
    </div>
  </div>
</header>

<!-- ========== 学科选择页 ========== -->
<main id="subject-page" class="page">
  <div class="page-hero">
    <h2 class="page-title">选择学科</h2>
    <p class="page-sub">点击卡片开始听写</p>
  </div>
  <div id="subject-list" class="subject-grid"></div>
</main>

<!-- ========== 听写页 ========== -->
<main id="dictation-page" class="page hidden">
  <div class="dictation-header">
    <button class="back-btn" id="btn-back">← 返回</button>
    <h2 class="page-title" id="dictation-title"></h2>
  </div>

  <div class="controls">
    <div id="plugin-config" class="plugin-config-row"></div>

    <div class="control-row">
      <div class="control-item">
        <label class="ctrl-label" for="count-input">数量</label>
        <div class="stepper">
          <button class="stepper-btn" id="count-minus">-</button>
          <input type="number" class="stepper-input" id="count-input" value="12" min="1" max="36" step="1">
          <button class="stepper-btn" id="count-plus">+</button>
          <button class="stepper-btn" id="count-max" title="设为最大数量">max</button>
        </div>
      </div>
      <div class="control-item">
        <span class="ctrl-label">列数</span>
        <div class="stepper">
          <button class="stepper-btn" id="col-minus">-</button>
          <span class="stepper-val" id="col-display">3</span>
          <button class="stepper-btn" id="col-plus">+</button>
        </div>
      </div>
      <button class="tool-btn layout-btn" id="btn-layout" title="切换列表/网格">☰</button>
      <div class="control-item">
        <label class="ctrl-label" for="font-slider">字号</label>
        <button class="tool-btn fs-btn" id="fs-minus" title="缩小">A-</button>
        <input type="range" class="font-slider" id="font-slider" min="60" max="200" value="100" step="5">
        <button class="tool-btn fs-btn" id="fs-plus" title="放大">A+</button>
        <span class="tool-val" id="fs-display">100%</span>
      </div>
      <button id="btn-shuffle" class="btn btn-dark">随机出题</button>
      <button id="btn-reveal" class="btn btn-ghost" disabled>公布答案</button>
    </div>
  </div>

  <div id="card-grid" class="card-grid"></div>
</main>

<!-- ========== 更新日志弹窗 ========== -->
<div id="changelog-overlay" class="changelog-overlay hidden">
  <div class="changelog-card">
    <button class="modal-close-x" id="btn-changelog-close-x" title="关闭">✕</button>
    <h2>更新日志</h2>
    <div class="changelog-body" id="changelog-body"></div>
  </div>
</div>

<!-- ========== 系统日志弹窗 ========== -->
<div id="syslog-overlay" class="changelog-overlay hidden">
  <div class="changelog-card">
    <button class="modal-close-x" id="btn-syslog-close-x" title="关闭">✕</button>
    <h2>系统日志</h2>
    <div id="syslog-body" class="changelog-body"></div>
  </div>
</div>

<!-- ========== 关于弹窗 ========== -->
<div id="about-overlay" class="changelog-overlay hidden">
  <div class="changelog-card">
    <button class="modal-close-x" id="btn-about-close-x" title="关闭">✕</button>
    <h2>关于 SeaScribe</h2>
    <div id="about-body" class="changelog-body"></div>
  </div>
</div>

<!-- ========== Scripts ========== -->
<script>
// Pre-init for non-module scripts (picker, config) that need SeaScribe at parse time
window.SeaScribe = {
  esc: function(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; },
  delay: function(ms) { return new Promise(function(r) { setTimeout(r, ms); }); },
  bindModal: function(overlayId, closeXId) {
    var overlay = document.getElementById(overlayId);
    var closeX = document.getElementById(closeXId);
    function close() { overlay.classList.add('hidden'); }
    if (closeX) closeX.addEventListener('click', close);
    overlay.addEventListener('click', function(e) { if (e.target === overlay) close(); });
  }
};
window.SubjectRegistry = {
  _plugins: new Map(),
  register: function(p) { if (p && p.meta && p.meta.id) this._plugins.set(p.meta.id, p); },
  get: function(id) { return this._plugins.get(id) || null; },
  list: function() { return Array.from(this._plugins.values()); }
};
</script>
<script src="config/english/config.js?v=6.1.3"></script>
<script src="plugins/english/plugin.js?v=6.1.3"></script>
<script src="config/chemistry/config.js?v=6.1.3"></script>
<script src="plugins/chemistry/plugin.js?v=6.1.3"></script>
<script src="config/enword/config.js?v=6.1.3"></script>
<script src="plugins/enword/plugin.js?v=6.1.3"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"
  integrity="sha384-JSZXO0kKYHTylAsDYTb+7Kg2eUyalm19b8Pydcdf8sQ1cCKYZr9lLahoKT9+LFY5"
  crossorigin="anonymous"></script>
<script src="config/picker/config.js?v=6.1.3"></script>
<script type="module" src="main/picker/index.js?v=6.1.3"></script>
<script type="module" src="main/core/app.js?v=6.1.3"></script>
</body>
</html>
